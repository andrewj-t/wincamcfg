# Dependabot policy
#
# - cargo: security advisories only (open-pull-requests-limit: 0 disables
#   version updates). Routine freshness is manual: run `cargo update` when
#   making other changes anyway. Security PRs get an automatic patch bump
#   (auto-patch-bump.yml) and therefore produce a release when merged.
# - github-actions: version updates ARE enabled so the commit-SHA pins in
#   .github/workflows stay current. These PRs do not bump the crate version,
#   and release.yml skips when the version tag already exists, so merging
#   them never produces a release.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
