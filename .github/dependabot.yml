# Dependabot policy
#
# - cargo: security advisories only (open-pull-requests-limit: 0 disables
#   version updates). Routine freshness is manual: run `cargo update` when
#   making other changes anyway.
# - github-actions: version updates ARE enabled so the commit-SHA pins in
#   .github/workflows stay current.
#
# Neither kind of PR releases anything by itself. Merged updates accumulate
# in the release PR that release-plz maintains (see release-plz.toml) and
# ship when that PR is merged. The commit-message prefixes below are
# Conventional Commit types that release-plz uses to sort the changelog:
# dependency bumps land under "Dependencies", CI pin refreshes are omitted.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
