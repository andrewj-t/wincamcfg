name: CI

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# No path filter: "Build and Test" is a required check on main, so it must
# report on every PR (including docs-only ones) or the PR can never merge.
on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml supplies rustflags (Control Flow Guard); a RUSTFLAGS
  # environment variable would replace them, so none is set here.

# Ensure the workflow only runs once per PR; subsequent pushes cancel and
# restart it. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # rustup on the runner installs the toolchain named in rust-toolchain.toml.
    - name: Install Rust toolchain
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - name: Cache cargo registry and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Build
      run: cargo build --release --locked --verbose

    - name: Run tests
      run: cargo test --locked --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wincamcfg-windows
        path: target/release/wincamcfg.exe

  # Proves the crate still builds on the declared minimum supported Rust
  # version (rust-version in Cargo.toml).
  msrv:
    name: MSRV (1.88)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust 1.88.0
      run: rustup toolchain install 1.88.0 --profile minimal

    - name: Check with MSRV
      run: cargo +1.88.0 check --locked --all-targets

  # Warns (never fails) when semver-compatible dependency updates are available,
  # so the manual "cargo update alongside other changes" policy doesn't get missed.
  outdated-deps:
    name: Check for Outdated Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Check lockfile freshness
      shell: bash
      run: |
        UPDATES=$(cargo update --dry-run 2>&1 | grep ' -> ' || true)
        if [ -n "$UPDATES" ]; then
          COUNT=$(echo "$UPDATES" | wc -l)
          echo "::warning title=Outdated dependencies ($COUNT)::Semver-compatible updates are available. Run 'cargo update' and include Cargo.lock in this PR."
          {
            echo "### :warning: Outdated dependencies"
            echo ""
            echo "Run \`cargo update\` and include the refreshed \`Cargo.lock\` in this PR."
            echo ""
            echo '```'
            echo "$UPDATES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Lockfile is up to date."
          echo ":white_check_mark: Lockfile is up to date." >> "$GITHUB_STEP_SUMMARY"
        fi

  # Runs only after lint/build/test pass — no point scanning code that doesn't compile.
  # Requires CodeQL "default setup" to be DISABLED in the repo's code scanning settings,
  # otherwise the analysis upload is rejected.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Analyze
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: '/language:${{ matrix.language }}'
