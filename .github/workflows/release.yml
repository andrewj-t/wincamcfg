name: Release

# Release PR bot (release-plz). See release-plz.toml for the overview.
#
# Every push to main:
#   release-plz-pr       opens/updates the release PR (version bump + changelog)
#   release-plz-release  if Cargo.toml's version has no tag yet (a merged release
#                        PR), tags it and creates the GitHub release
#   publish-binary       builds, attests and uploads the Windows binary + SBOMs
#                        to that release
#
# Token: the release PR must trigger CI, and pull requests opened with the
# default GITHUB_TOKEN never trigger workflows. Add a fine-grained personal
# access token as the RELEASE_PLZ_TOKEN secret (repository access: this repo;
# permissions: Contents read/write, Pull requests read/write). Without it the
# job falls back to GITHUB_TOKEN and the release PR shows "waiting for
# status" until it is closed and reopened by hand.

permissions: {}

on:
  push:
    branches:
      - main

# Never run two releases at once, and never cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned so the SBOM generator is not a floating dependency inside the
  # job that holds attestation permissions.
  CARGO_SBOM_VERSION: 0.10.0

jobs:
  release-plz-release:
    name: Tag and create release
    if: github.repository_owner == 'andrewj-t'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Run release-plz release
      id: release-plz
      uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
      with:
        command: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Open or update release PR
    if: github.repository_owner == 'andrewj-t'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Run release-plz release-pr
      uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
      with:
        command: release-pr
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  publish-binary:
    name: Build, attest and upload binary
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    # The action's `releases` output is the JSON printed by
    # `release-plz release`; tolerate both the bare array and the wrapped
    # object form.
    - name: Resolve release tag
      id: tag
      shell: bash
      env:
        RELEASES: ${{ needs.release-plz-release.outputs.releases }}
      run: |
        TAG=$(jq -r 'if type == "array" then .[0].tag else .releases[0].tag end' <<< "$RELEASES")
        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          echo "::error::Could not determine the release tag from: $RELEASES"
          exit 1
        fi
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
        echo "Releasing $TAG"

    # Build exactly the tagged commit, from a clean (uncached) build directory,
    # so the attested binary is reproducible from the tag alone.
    - name: Checkout tagged commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.tag.outputs.TAG }}
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --locked

    - name: Install cargo-sbom
      shell: bash
      run: cargo install cargo-sbom --version "$CARGO_SBOM_VERSION" --locked

    - name: Generate SBOMs
      shell: bash
      run: |
        cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
        cargo sbom --output-format cyclone_dx_json_1_6 > sbom.cyclonedx.json
        cp target/release/wincamcfg.exe wincamcfg.exe

    - name: Attest binary provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'wincamcfg.exe'

    - name: Attest SPDX SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: 'wincamcfg.exe'
        sbom-path: 'sbom.spdx.json'

    - name: Attest CycloneDX SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: 'wincamcfg.exe'
        sbom-path: 'sbom.cyclonedx.json'

    - name: Upload assets to the release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.TAG }}
      run: gh release upload "$TAG" wincamcfg.exe sbom.spdx.json sbom.cyclonedx.json --clobber
